<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Picnic Participants List</title>
<style>
  :root{
    --navy-900:#0F2557;
    --navy-800:#132C64;
    --navy-700:#1B3A7A;
    --navy-500:#2E4F9E;
    --gold:#D4A94C;
    --gold-dark:#B8862E;
    --gold-light:#F3D98B;
    --bg-1:#EAF0FB;
    --bg-2:#DCE7FA;
    --card:#FFFFFF;
    --line:#E4EAF6;
    --text:#152040;
    --muted:#5E6C8C;
    --amber-bg:#FFF4DC;
    --amber-text:#8A5A00;
    --forest:#227A54;
    --forest-bg:#E7F5EE;
    --shadow-color:15,37,87;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-2), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #F0E6C8, transparent 55%),
      var(--bg-1);
    color:var(--text);
    padding:20px 14px 56px;
    -webkit-font-smoothing:antialiased;
  }

  .page-controls{
    max-width:820px;margin:0 auto 18px;
    display:flex;justify-content:center;
  }
  .download-btn{
    display:inline-flex;align-items:center;gap:9px;
    background:linear-gradient(135deg,var(--navy-800),var(--navy-500));
    color:#fff;border:none;
    padding:13px 26px;border-radius:12px;
    font-size:.98rem;font-weight:700;letter-spacing:.2px;
    cursor:pointer;font-family:inherit;
    box-shadow:0 10px 24px -6px rgba(var(--shadow-color),.45), 0 2px 6px rgba(var(--shadow-color),.15);
    transition:transform .12s ease, box-shadow .2s ease, filter .15s ease;
  }
  .download-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 14px 30px -6px rgba(var(--shadow-color),.5);}
  .download-btn:active{transform:translateY(0) scale(.98);}
  .download-btn:disabled{opacity:.6;cursor:progress;transform:none;}
  .download-btn svg{width:17px;height:17px;flex-shrink:0;}

  /* ===================== TICKET (captured as PNG) ===================== */
  #ticket{
    max-width:820px;
    margin:0 auto;
    background:var(--card);
    border-radius:26px;
    padding:32px 32px 26px;
    position:relative;
    overflow:hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 24px 60px -12px rgba(var(--shadow-color),.28),
      0 4px 14px rgba(var(--shadow-color),.08);
    border:1px solid #fff;
  }
  #ticket::before{ /* corner flag, top-left */
    content:"";
    position:absolute;top:0;left:0;
    width:0;height:0;
    border-style:solid;
    border-width:78px 78px 0 0;
    border-color:var(--navy-700) transparent transparent transparent;
    opacity:.9;
  }
  #ticket::after{ /* thin gold seam under the flag */
    content:"";
    position:absolute;top:0;left:0;
    width:0;height:0;
    border-style:solid;
    border-width:78px 78px 0 0;
    border-color:transparent transparent transparent transparent;
    background:none;
  }

  .top-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;flex-wrap:wrap;margin-bottom:4px;position:relative;z-index:1;
  }

  .brand{display:flex;align-items:center;gap:16px;flex:1;min-width:230px;}
  .crest{
    width:68px;height:68px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #ffffff 0%, #eef3fb 55%, #d9e5f8 100%);
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:1.85rem;
    box-shadow:0 4px 12px rgba(var(--shadow-color),.15);
  }
  .brand-text .tagline{
    font-size:.7rem;color:var(--gold-dark);font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;margin:0 0 3px;
  }
  .brand-text h1{
    margin:0;font-size:clamp(1.25rem,4vw,1.65rem);color:var(--navy-900);
    font-family:Georgia,'Times New Roman',serif;letter-spacing:.2px;line-height:1.15;
  }
  .brand-text .addr{margin:4px 0 0;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:4px;}

  .meta{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .meta-chip{
    display:flex;align-items:center;gap:6px;
    background:#F3F8FF;border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;font-size:.8rem;color:var(--navy-700);font-weight:700;
    white-space:nowrap;
  }

  .banner{
    margin:20px 0 22px;
    background:
      linear-gradient(120deg, var(--navy-900) 0%, var(--navy-700) 55%, var(--navy-500) 100%);
    border-radius:16px;
    padding:20px 24px;
    color:#fff;
    text-align:center;
    position:relative;
    box-shadow:0 10px 26px -8px rgba(var(--shadow-color),.5);
  }
  .banner::after{
    content:"";
    position:absolute;inset:0;border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%);
    pointer-events:none;
  }
  .banner .t1{font-size:clamp(1.1rem,3.6vw,1.35rem);font-weight:700;margin:0 0 3px;letter-spacing:.2px;}
  .banner .t2{
    font-size:clamp(1.3rem,4.6vw,1.7rem);font-weight:800;margin:0;
    color:var(--gold-light);
    font-family:Georgia,'Times New Roman',serif;
  }

  .columns{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media (max-width:640px){ .columns{grid-template-columns:1fr;gap:18px;} }

  .table-wrap{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:#fff;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    background:linear-gradient(120deg,var(--navy-700),var(--navy-500));
    color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;
    padding:10px 10px;text-align:left;font-weight:700;
  }
  thead th:first-child{text-align:center;width:40px;}
  thead th:last-child{text-align:right;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:.9rem;}
  tbody tr:nth-child(even){background:#FAFBFF;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td.name-cell{font-weight:600;color:var(--text);}
  tbody td.sn-cell{text-align:center;}
  .sn{
    color:var(--navy-700);font-weight:800;font-size:.78rem;
    background:#EAF0FC;border-radius:50%;width:26px;height:26px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  tbody td.amt{text-align:right;font-weight:800;color:var(--forest);white-space:nowrap;font-size:.88rem;}

  .summary{
    margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
    background:linear-gradient(135deg,#F5F9FF,#EEF3FE);
    border:1px solid var(--line);border-radius:16px;padding:18px;
  }
  @media (max-width:560px){ .summary{grid-template-columns:1fr;} }
  .summary-item{
    text-align:center;background:#fff;border-radius:12px;padding:14px 10px;
    border:1px solid var(--line);
  }
  .summary-item .icon{font-size:1.2rem;margin-bottom:4px;}
  .summary-item .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;font-weight:700;}
  .summary-item .value{font-size:1.2rem;font-weight:800;color:var(--navy-900);}
  .summary-item.total .value{
    color:var(--gold-dark);font-size:1.35rem;
    background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
    -webkit-background-clip:text;background-clip:text;
  }
  .summary-item.total{background:linear-gradient(135deg,#FFF9EE,#FFF3DC);border-color:#F0DDA5;}
  .summary-item.total .value{color:var(--gold-dark);-webkit-text-fill-color:var(--gold-dark);}

  .note{
    margin-top:18px;background:var(--amber-bg);color:var(--amber-text);
    border-radius:12px;padding:12px 18px;font-size:.85rem;text-align:center;font-weight:700;
    border:1px solid #F0DDA5;
  }

  .footer-row{
    margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;
  }
  .signoff{
    font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--navy-700);
    font-size:clamp(1rem,3vw,1.15rem);line-height:1.3;
  }
  .class-tag{text-align:right;font-size:.84rem;color:var(--muted);}
  .class-tag strong{display:block;color:var(--navy-900);font-size:.98rem;margin-bottom:1px;}

  .empty-state, .loading, .error-state{
    text-align:center;color:var(--muted);padding:60px 16px;font-size:.95rem;line-height:1.6;
  }
  .error-state{color:var(--amber-text);}
  .error-state code{background:#00000010;padding:2px 6px;border-radius:5px;}

  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--navy-500);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Small phones */
  @media (max-width:420px){
    #ticket{padding:22px 16px 20px;border-radius:18px;}
    .crest{width:54px;height:54px;font-size:1.5rem;}
    .meta{width:100%;justify-content:flex-start;}
    thead th, tbody td{padding:8px 6px;font-size:.8rem;}
    .banner{padding:16px 14px;}
  }

  @media print{
    body{background:#fff;padding:0;}
    .page-controls{display:none;}
    #ticket{box-shadow:none;max-width:100%;}
  }
</style>
</head>
<body>

<div class="page-controls">
  <button class="download-btn" id="downloadBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span id="downloadBtnText">Download as PNG</span>
  </button>
</div>

<div id="ticket">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    Loading participant list…
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<!-- html2canvas: renders the #ticket DOM node to a PNG for download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
/* ============================================================
   FIREBASE CONFIG — must match admin.html EXACTLY (same project)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBv7MKmb2aevcaFOajr02DmBF7JNxNxIDw",
  authDomain: "dozo-3ad6f.firebaseapp.com",
  databaseURL: "https://dozo-3ad6f-default-rtdb.firebaseio.com",
  projectId: "dozo-3ad6f",
  storageBucket: "dozo-3ad6f.firebasestorage.app",
  messagingSenderId: "843093561816",
  appId: "1:843093561816:web:6ab6a609c0c393a50b62ad"
};

const ticket = document.getElementById('ticket');

try {
  firebase.initializeApp(firebaseConfig);
} catch (err) {
  ticket.innerHTML = `<div class="error-state">
    ⚠️ Could not connect to Firebase.<br>
    <code>${err.message}</code>
  </div>`;
}

const db = firebase.database();

let details = {};
let participants = {};
let gotDetails = false, gotParticipants = false;

db.ref('picnicList/details').on('value', (snap) => {
  details = snap.val() || {};
  gotDetails = true;
  tryRender();
}, (err) => showError(err));

db.ref('picnicList/participants').on('value', (snap) => {
  participants = snap.val() || {};
  gotParticipants = true;
  tryRender();
}, (err) => showError(err));

function showError(err) {
  ticket.innerHTML = `<div class="error-state">
    ⚠️ Couldn't load the list.<br>
    <code>${esc(err.message)}</code>
  </div>`;
}

function tryRender() {
  if (gotDetails && gotParticipants) render();
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const entries = Object.values(participants)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  const schoolName = esc(details.schoolName || 'Durbar High School');
  const schoolAddress = esc(details.schoolAddress || 'Durbarmarg, Kathmandu, Nepal');
  const title1 = esc(details.listTitle1 || "2083 Class 11 'B'");
  const title2 = esc(details.listTitle2 || 'Picnic Participants List');
  const eventDate = esc(details.eventDate || '');
  const eventTime = esc(details.eventTime || '');
  const noteText = esc(details.noteText || 'Please be on time and follow all the school instructions during the picnic.');
  const amountPerPerson = Number(details.amountPerPerson) || 0;

  if (entries.length === 0) {
    ticket.innerHTML = `
      <div class="top-row">
        <div class="brand">
          <div class="crest">🎓</div>
          <div class="brand-text">
            <p class="tagline">Learn Today, Lead Tomorrow</p>
            <h1>${schoolName}</h1>
            <p class="addr">📍 ${schoolAddress}</p>
          </div>
        </div>
      </div>
      <div class="banner">
        <p class="t1">${title1}</p>
        <p class="t2">${title2}</p>
      </div>
      <div class="empty-state">No participants added yet. Check back soon!</div>
    `;
    return;
  }

  const total = entries.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const half = Math.ceil(entries.length / 2);
  const colA = entries.slice(0, half);
  const colB = entries.slice(half);

  function buildRows(list, startIndex) {
    return list.map((p, i) => `
      <tr>
        <td class="sn-cell"><span class="sn">${startIndex + i + 1}</span></td>
        <td class="name-cell">${esc(p.name)}</td>
        <td class="amt">Rs. ${Number(p.amount || 0).toLocaleString('en-IN')}</td>
      </tr>
    `).join('');
  }

  function buildTable(list, startIndex) {
    if (list.length === 0) return '';
    return `
      <div class="table-wrap">
        <table>
          <thead><tr><th>S.N.</th><th>Name</th><th>Amount</th></tr></thead>
          <tbody>${buildRows(list, startIndex)}</tbody>
        </table>
      </div>
    `;
  }

  ticket.innerHTML = `
    <div class="top-row">
      <div class="brand">
        <div class="crest">🎓</div>
        <div class="brand-text">
          <p class="tagline">Learn Today, Lead Tomorrow</p>
          <h1>${schoolName}</h1>
          <p class="addr">📍 ${schoolAddress}</p>
        </div>
      </div>
      <div class="meta">
        ${eventDate ? `<span class="meta-chip">📅 ${eventDate}</span>` : ''}
        ${eventTime ? `<span class="meta-chip">🕒 ${eventTime}</span>` : ''}
      </div>
    </div>

    <div class="banner">
      <p class="t1">${title1}</p>
      <p class="t2">${title2}</p>
    </div>

    <div class="columns">
      <div>${buildTable(colA, 0)}</div>
      <div>${buildTable(colB, colA.length)}</div>
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="icon">👥</div>
        <div class="label">Total Participants</div>
        <div class="value">${entries.length} Students</div>
      </div>
      <div class="summary-item">
        <div class="icon">💰</div>
        <div class="label">Amount Per Person</div>
        <div class="value">Rs. ${amountPerPerson.toLocaleString('en-IN')}</div>
      </div>
      <div class="summary-item total">
        <div class="icon">🧮</div>
        <div class="label">Total Collection</div>
        <div class="value">Rs. ${total.toLocaleString('en-IN')}</div>
      </div>
    </div>

    ${noteText ? `<div class="note">📣 Note: ${noteText}</div>` : ''}

    <div class="footer-row">
      <div class="signoff">Have a Safe &amp;<br>Enjoyable Picnic!</div>
      <div class="class-tag">
        <strong>${title1}</strong>
        ${schoolName}
      </div>
    </div>
  `;
}

/* ---------------- Download as PNG ---------------- */
document.getElementById('downloadBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadBtn');
  const btnText = document.getElementById('downloadBtnText');
  const target = document.getElementById('ticket');

  btn.disabled = true;
  const originalText = btnText.textContent;
  btnText.textContent = 'Preparing image…';

  try {
    const canvas = await html2canvas(target, {
      scale: 2.5,
      backgroundColor: '#ffffff',
      useCORS: true,
    });

    const link = document.createElement('a');
    link.download = 'picnic-participants-list.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    alert('Could not generate image: ' + err.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = originalText;
  }
});
</script>
</body>
</html>
